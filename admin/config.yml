# true = when you run the admin on your own computer (localhost) with "npx decap-server",
# saves go to the files on your computer. On nebcd.org it always uses GitHub.
local_backend: false

backend:
  name: github
  repo: ryansalts/nebcd
  branch: main
  app_id: Ov23lixyYlkDDNfeg1Ao
  base_url: https://nebcd-oauth.ryansalts.workers.dev

media_folder: "assets"
public_folder: "assets"

# ─────────────────────────────────────────────────────────────────────────────
# How the admin is organized (one screen per job):
#   📅 Events            → _data/events.json
#   🗳️ Elections         → _data/endorsements.json + _data/representatives.json + _data/elections.json
#   🏠 Homepage          → _data/homepage.json
#   👥 Leadership        → _data/leadership.json
#   📍 Office & Contact  → _data/office.json
#   🔗 Links & Accounts  → _data/links.json
#   🛍️ Store             → _data/store.json
#   🤝 Sponsor           → _data/sponsor.json
#   ⚙️ Site Mode         → _data/site-mode.json  (on/off switches)
# Every save rebuilds the site; changes are live in about a minute.
# ─────────────────────────────────────────────────────────────────────────────

collections:

  # ── Events ────────────────────────────────────────────────────────────────
  - name: "events"
    label: "📅 Events"
    label_singular: "Event"
    description: "Events shown on the Events page and the homepage. They're sorted by date automatically, and past events disappear from the site on their own the day after they happen, so there's no need to delete old ones."
    files:
      - label: "Events List"
        name: "events"
        file: "_data/events.json"
        fields:
          - label: "Events"
            name: "events"
            widget: list
            label_singular: "Event"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Event Title", name: title, widget: string }
              - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false }
              - { label: "Time", name: time, widget: string, hint: "Typed exactly as it should appear, e.g. 10:00 AM – Noon or 5:30 PM" }
              - label: "Event Type"
                name: type
                widget: select
                hint: "Sets the colored tag on the event. Election events are highlighted in red."
                options:
                  - { label: "Meeting", value: "Meeting" }
                  - { label: "Volunteer", value: "Volunteer" }
                  - { label: "Social", value: "Social" }
                  - { label: "Election", value: "Election" }
              - { label: "Location", name: location, widget: string, hint: "e.g. NEBCD Office — 6521 San Pedro Ave. or Zoom (link sent after RSVP)" }
              - { label: "Description", name: description, widget: text, hint: "One or two sentences about the event." }
              - { label: "Button Label", name: button_label, widget: string, hint: "Text on the event's button, e.g. RSVP or Sign Up on Mobilize" }
              - { label: "Button Link", name: button_url, widget: string, hint: "Full web address for the button. Use # if there's no link yet." }
              - label: "Show on Homepage"
                name: featured
                widget: boolean
                default: false
                hint: "Turn on to make sure this event appears in the homepage's Upcoming Events section (up to 3 are shown). Any open spots are filled automatically: with Mobilize shifts during campaign season, or with the next upcoming events in the off-season."

  # ── Elections ─────────────────────────────────────────────────────────────
  - name: "elections"
    label: "🗳️ Elections"
    description: "Everything on the Election page (nebcd.org/endorsements): candidates, representatives, intro text and voting resources. Which of these the page shows (Endorsements, Election Guide, Representatives or Hidden) is set in ⚙️ Site Mode."
    files:
      - label: "Candidates"
        name: "endorsements"
        file: "_data/endorsements.json"
        fields:
          - label: "Candidates"
            name: "endorsements"
            widget: list
            label_singular: "Candidate"
            summary: "{{fields.name}} — {{fields.office}}"
            fields:
              - { label: "Candidate Name", name: name, widget: string }
              - { label: "Office / Race", name: office, widget: string, hint: "Shown under the name, e.g. NEISD Board of Trustees or Attorney General" }
              - { label: "Race Badge", name: race_badge, widget: string, required: false, hint: "Short label on the card, e.g. District 3 or Place 4. Leave blank for runoff candidates." }
              - label: "Election"
                name: election
                widget: select
                hint: "Which section of the page the candidate appears in."
                options:
                  - { label: "General Election", value: "general" }
                  - { label: "Primary", value: "primary" }
                  - { label: "Runoff", value: "runoff" }
              - { label: "Race Group", name: race_group, widget: string, required: false, hint: "Candidates with the same Race Group are shown together under that heading, e.g. Texas House. Leave blank for runoff candidates." }
              - { label: "Photo", name: photo, widget: image, required: false, hint: "Candidate headshot. Leave blank if you don't have one." }
              - { label: "Campaign Website", name: campaign_url, widget: string, required: false, hint: "Full web address including https://" }
              - { label: "Co-Endorsers", name: co_endorsers, widget: string, required: false, hint: "Other organizations that endorse this candidate, separated by commas. Shown as \"Also endorsed by…\"" }
              - { label: "Facebook Link", name: facebook_url, widget: string, required: false }
              - { label: "Instagram Link", name: instagram_url, widget: string, required: false }
              - label: "Show on Homepage"
                name: featured
                widget: boolean
                default: false
                hint: "Turn on to show this candidate in the homepage's election section. Up to 4 are shown."

      - label: "Representatives"
        name: "representatives"
        file: "_data/representatives.json"
        fields:
          - label: "Representatives"
            name: "representatives"
            widget: list
            label_singular: "Representative"
            summary: "{{fields.name}} — {{fields.office}}"
            hint: "Shown when ⚙️ Site Mode → Election Page Mode is set to Connect With Your Representatives. You can fill this in ahead of time; it stays hidden until then. People are grouped under their Group heading, in the order the groups first appear in this list."
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Office", name: office, widget: string, hint: "e.g. U.S. Senator, State Representative, County Commissioner" }
              - { label: "Group", name: group, widget: string, hint: "Heading this person is listed under, e.g. U.S. Senate, U.S. House, Texas House, Bexar County. Type it the same way for everyone in the group." }
              - { label: "District", name: district, widget: string, required: false, hint: "Short label on the card, e.g. CD-21, HD-121 or Precinct 3. Leave blank for statewide offices." }
              - { label: "Photo", name: photo, widget: image, required: false, hint: "Official headshot. Leave blank if you don't have one." }
              - { label: "Office Phone", name: phone, widget: string, required: false, hint: "e.g. 210-555-0100" }
              - { label: "Email", name: email, widget: string, required: false }
              - { label: "Contact Form Link", name: contact_url, widget: string, required: false, hint: "The official \"contact me\" page, if they have one. Shown as the main Contact button." }
              - { label: "Website", name: website, widget: string, required: false, hint: "Official website, including https://" }
              - { label: "Facebook Link", name: facebook_url, widget: string, required: false }
              - { label: "Instagram Link", name: instagram_url, widget: string, required: false }
              - label: "Show on Homepage"
                name: featured
                widget: boolean
                default: false
                hint: "Turn on to show this person in the homepage's election section while the page is in Representatives mode. Up to 4 are shown."
          - label: "Find Your Representatives Links"
            name: "lookup_links"
            widget: list
            label_singular: "Link"
            summary: "{{fields.title}}"
            hint: "Cards at the top of the Representatives page, so anyone can look up their own officials by address."
            fields:
              - { label: "Icon (emoji)", name: icon, widget: string, hint: "One emoji, e.g. 🏛️" }
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Link Label", name: link_label, widget: string, hint: "Small link text at the bottom of the card, e.g. bexar.org →" }
              - { label: "Link", name: url, widget: string, hint: "Full web address including https://" }

      - label: "Election Page Text & Voting Resources"
        name: "election-page"
        file: "_data/elections.json"
        fields:
          - label: "Election Year"
            name: endorsements_cycle_label
            widget: string
            required: false
            hint: "Used in the Election page title and headings, e.g. 2026. Leave blank to use the current year automatically."
          - label: "Intro Text: Endorsements"
            name: intro_endorsements
            widget: text
            required: false
            hint: "Shown at the top of the Election page and in the homepage's election section while the page is in Endorsements mode. Leave blank for: NEBCD proudly endorses these candidates for the [year] election cycle."
          - label: "Intro Text: Election Guide"
            name: endorsements_intro
            widget: text
            required: false
            hint: "Shown while the page is in Election Guide mode."
          - label: "Intro Text: Representatives"
            name: intro_representatives
            widget: text
            required: false
            hint: "Shown while the page is in Connect With Your Representatives mode. Leave blank for: Your voice matters between elections too. Find out who represents you and how to reach them."
          - label: "Voting Resources"
            name: voting_resources
            widget: list
            label_singular: "Resource"
            summary: "{{fields.title}}"
            hint: "The \"Know Before You Vote\" cards on the Election page (Endorsements and Election Guide modes)."
            fields:
              - { label: "Icon (emoji)", name: icon, widget: string, hint: "One emoji, e.g. 🗳️" }
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Link Label", name: link_label, widget: string, hint: "Small link text at the bottom of the card, e.g. bexar.org →" }
              - { label: "Link", name: url, widget: string, hint: "Full web address including https://" }

  # ── Homepage ──────────────────────────────────────────────────────────────
  - name: "homepage"
    label: "🏠 Homepage"
    description: "Homepage photos and text, the meeting line, and the image shown when pages are shared on social media. (Homepage events and candidates are chosen with the \"Show on Homepage\" switch in 📅 Events and 🗳️ Elections.)"
    files:
      - label: "Homepage Photos"
        name: "homepage"
        file: "_data/homepage.json"
        fields:
          - { label: "Top Photo", name: hero_image, widget: image, hint: "The large background photo at the top of the homepage. Also used as the preview image when the homepage is shared on social media." }
          - { label: "Top Photo Description", name: hero_image_alt, widget: string, hint: "A few words describing the photo, for screen readers and search engines." }
          - label: "Monthly Meetings Line"
            name: meeting_text
            widget: string
            required: false
            hint: "Shown after \"Monthly Meetings —\" in the homepage's mission section. Leave blank for: 2nd Saturday of each month, 10 a.m. to noon. If meetings move around, try: Dates and locations are posted on our Events page."
          - { label: "Mission Photo (large)", name: mission_photo_1, widget: image, required: false, hint: "The larger photo beside the mission text. Leave blank to keep the current photo." }
          - { label: "Mission Photo (large) Description", name: mission_photo_1_alt, widget: string, required: false, hint: "A few words describing the photo, for screen readers." }
          - { label: "Mission Photo (small)", name: mission_photo_2, widget: image, required: false, hint: "The smaller overlapping photo. Leave blank to keep the current photo." }
          - { label: "Mission Photo (small) Description", name: mission_photo_2_alt, widget: string, required: false }
          - { label: "Social Sharing Image", name: share_image, widget: image, required: false, hint: "The preview picture when any page other than the homepage is shared on Facebook, texts, etc. (The homepage uses its Top Photo.) Wide photos work best, about 1200 × 630. Leave blank to keep the office photo." }
          - label: "Photo Gallery"
            name: gallery_photos
            widget: list
            label_singular: "Photo"
            summary: "{{fields.alt}}"
            hint: "The \"NEBCD in the Community\" photo grid. Drag photos to reorder them."
            fields:
              - { label: "Photo", name: src, widget: image }
              - { label: "Photo Description", name: alt, widget: string, hint: "A few words describing the photo, e.g. NEBCD members at the Labor Day Picnic" }
              - label: "Size"
                name: size
                widget: select
                default: "normal"
                hint: "Tall and Wide photos take up two spaces in the grid. Mix a few in for variety."
                options:
                  - { label: "Normal", value: "normal" }
                  - { label: "Tall", value: "tall" }
                  - { label: "Wide", value: "wide" }

  # ── Leadership ────────────────────────────────────────────────────────────
  - name: "leadership"
    label: "👥 Leadership"
    description: "The Club Leadership list on the homepage. Names only, with an optional title. During campaign season it sits under the mission section; in Off-Season Mode it takes over the Visit Us spot at the bottom of the homepage, with a photo. Hidden until Show Leadership is switched on."
    files:
      - label: "Club Leadership"
        name: "leadership"
        file: "_data/leadership.json"
        fields:
          - label: "Show Leadership"
            name: show_leadership
            widget: boolean
            required: false
            default: false
            hint: "Turn on to show the Club Leadership section on the homepage. In Off-Season Mode a \"Leadership\" link also appears in the menu, where Visit Us used to be."
          - label: "Intro Text"
            name: intro
            widget: string
            required: false
            hint: "One line under the heading. Leave blank for: The volunteers who lead NEBCD and keep the club running."
          - { label: "Photo (off-season)", name: photo, widget: image, required: false, hint: "The photo beside the leadership names at the bottom of the homepage in Off-Season Mode. A group photo works best. Leave blank for the courthouse group photo." }
          - { label: "Photo Description", name: photo_alt, widget: string, required: false, hint: "A few words describing the photo, for screen readers." }
          - label: "Leaders"
            name: members
            widget: list
            label_singular: "Person"
            summary: "{{fields.name}}"
            hint: "Shown in this order. Drag to reorder, e.g. officers first."
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Title", name: title, widget: string, required: false, hint: "Optional, e.g. Chair or Treasurer. Leave blank to show the name only." }

  # ── Office & Contact ──────────────────────────────────────────────────────
  - name: "office"
    label: "📍 Office & Contact"
    description: "The office address, phone, email and hours. These appear in several places at once: the homepage's Visit Us section, the Store, Sponsor and Volunteer pages, the legal pages, and search engine listings. In ⚙️ Site Mode → Off-Season Mode the address and hours are hidden but kept here for next season."
    files:
      - label: "Office & Contact Info"
        name: "office"
        file: "_data/office.json"
        fields:
          - { label: "Street Address", name: office_address_street, widget: string, hint: "e.g. 6521 San Pedro Ave." }
          - { label: "City, State, ZIP", name: office_address_city, widget: string, hint: "e.g. San Antonio, TX 78216" }
          - { label: "Phone", name: office_phone, widget: string, required: false, hint: "e.g. 210-917-1790. Tap-to-call links are set up from this automatically. Leave blank to remove the phone number and every Call button from the site." }
          - { label: "Email", name: office_email, widget: string, hint: "Shown on contact links across the site, e.g. info@nebcd.org" }
          - { label: "Hours, Line 1", name: office_hours_line1, widget: string, hint: "e.g. Mon–Tue & Thu–Fri: 8 AM – 4 PM. Lines 1 and 2 also appear on the Store page." }
          - { label: "Hours, Line 2", name: office_hours_line2, widget: string, required: false, hint: "e.g. Wednesday: 8 AM – 7 PM" }
          - { label: "Hours, Line 3", name: office_hours_line3, widget: string, required: false, hint: "e.g. Sat–Sun: Closed (except events)" }
          - { label: "Google Maps Link", name: office_directions_url, widget: string, hint: "Used by every \"Get Directions\" button. Search the address in Google Maps, click Share, and paste the link here." }
          - { label: "Visit Us Photo", name: visit_photo, widget: image, hint: "Photo in the homepage's Visit Us section." }
          - { label: "Visit Us Photo Description", name: visit_photo_alt, widget: string, hint: "A few words describing the photo, for screen readers." }
          - { label: "Visit Us Text", name: visit_description, widget: text, hint: "The welcome paragraph in the homepage's Visit Us section." }

  # ── Links & Accounts ──────────────────────────────────────────────────────
  - name: "links"
    label: "🔗 Links & Accounts"
    description: "Donation links, social media and sign-up forms. Each link is used everywhere it appears on the site (header, footer and buttons), so changing it here updates every page."
    files:
      - label: "Links & Accounts"
        name: "links"
        file: "_data/links.json"
        fields:
          - { label: "Join / Membership Dues (ActBlue)", name: actblue_dues_url, widget: string, hint: "The \"Join / Donate\" button in the header and the \"Join on ActBlue\" button on the homepage." }
          - { label: "Donate (ActBlue)", name: actblue_donate_url, widget: string, hint: "The \"Donate on ActBlue\" link in the footer of every page." }
          - { label: "Facebook Page", name: facebook_url, widget: string, hint: "Footer link on every page." }
          - { label: "Instagram Page", name: instagram_url, widget: string, hint: "Footer link on every page." }
          - { label: "Get Involved Link", name: get_involved_url, widget: string, hint: "Where the \"Get Involved\" link in the header and footer goes." }
          - { label: "Mobilize Page", name: mobilize_url, widget: string, hint: "The \"View All Shifts on Mobilize\" button on the Events page, e.g. https://www.mobilize.us/nebcd/. Mobilize shows during campaign season, and in the off-season only if ⚙️ Site Mode → Keep Mobilize On in Off-Season is switched on." }
          - { label: "Volunteer Form ID (Google Form)", name: volunteer_form_id, widget: string, hint: "The form shown on the Volunteer page. In Google Forms, click Send → < > (embed) and copy the long code between /d/e/ and /viewform." }

  # ── Store ──────────────────────────────────────────────────────────────────
  - name: store
    label: "🛍️ Store"
    description: "The Store page: its intro text and the items shown. Store hours and address come from 📍 Office & Contact. The store is shown during campaign season only; in Off-Season Mode (⚙️ Site Mode) the page shows a \"closed for now\" notice and everything here is kept for next time."
    files:
      - name: store
        label: Store Text & Items
        file: _data/store.json
        fields:
          - label: Store Intro
            name: store_intro
            widget: text
            hint: "Shown at the top of the Store page. One or two sentences describing the store."

          - label: Items
            name: products
            widget: list
            label_singular: Item
            summary: "{{fields.name}}"
            fields:
              - { label: "Item Name", name: name, widget: string, hint: "e.g. T-Shirts, Bumper Stickers, Buttons & Pins" }
              - { label: "Description", name: description, widget: text, hint: "One or two sentences about this item." }
              - label: Photo
                name: photo
                widget: image
                required: false
                hint: "A photo of this item. WebP format loads fastest if you have it."
                media_folder: /assets
                public_folder: assets
              - label: "Show on Store Page"
                name: available
                widget: boolean
                default: true
                hint: "Turn off to hide this item without deleting it."

  # ── Sponsor ────────────────────────────────────────────────────────────────
  - name: sponsor
    label: "🤝 Sponsor"
    description: "The Sponsor page: its intro and the sponsorship details for each signature event."
    files:
      - name: sponsor
        label: Sponsor Page
        file: _data/sponsor.json
        fields:
          - label: Page Intro
            name: sponsor_intro
            widget: text
            hint: "Shown at the top of the Sponsor page. One or two sentences about partnering with NEBCD."

          - label: Sponsored Events
            name: events
            widget: list
            label_singular: Event
            summary: "{{fields.name}}"
            fields:
              - { label: "Event ID", name: id, widget: string, hint: "Short name for links to this section: lowercase, dashes instead of spaces, e.g. dining-with-democrats. Set it once and don't change it." }
              - { label: "Event Name", name: name, widget: string, hint: "e.g. Dining with Democrats" }
              - { label: "Label Above Name", name: eyebrow, widget: string, hint: "Small label above the event name, e.g. Signature Fundraiser" }
              - { label: "Description", name: description, widget: text, hint: "A paragraph describing this event for potential sponsors." }
              - { label: "Date", name: date, widget: string, required: false, hint: "e.g. Saturday, October 18, 2026. Leave blank if not confirmed yet." }
              - { label: "Venue", name: venue, widget: string, required: false, hint: "Venue name and/or address. Leave blank if not confirmed yet." }
              - { label: "Expected Attendance", name: attendance, widget: string, required: false, hint: "e.g. Expected 150–200 guests" }
              - label: Event Photo
                name: photo
                widget: image
                required: false
                hint: "Optional photo for this event's section."
                media_folder: /assets
                public_folder: assets
              - label: Sponsorship Levels
                name: tiers
                widget: list
                label_singular: "Sponsorship Level"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Level Name", name: name, widget: string, hint: "e.g. Presenting Sponsor, Gold Sponsor, Friend of NEBCD" }
                  - label: Perks
                    name: perks
                    widget: list
                    field:
                      label: Perk
                      name: perk
                      widget: string
                    hint: "One perk per line. Add as many as needed."

  # ── Site Mode ──────────────────────────────────────────────────────────────
  - name: "site-mode"
    label: "⚙️ Site Mode"
    description: "Seasonal switches that change what the site shows. Each one updates every affected page at once, and can be switched back anytime."
    files:
      - label: "Site Mode Switches"
        name: "site-mode"
        file: "_data/site-mode.json"
        fields:
          - label: "Off-Season Mode"
            name: off_season
            widget: boolean
            required: false
            default: false
            hint: "Turn ON after the election when the office closes. This hides the office (Visit Us section, address, hours), the Store and the Mobilize shifts all at once (Mobilize can be kept on with the next switch), and the homepage fills with upcoming events instead. Nothing is deleted. Turn it OFF again before the next primary to bring it all back."
          - label: "Keep Mobilize On in Off-Season"
            name: mobilize_off_season
            widget: boolean
            required: false
            default: false
            hint: "Mobilize shifts always show during campaign season. Turn this on only if the club is using Mobilize while Off-Season Mode is on."
          - label: "Election Page Mode"
            name: endorsements_page_mode
            widget: select
            required: false
            default: "endorsements"
            options:
              - { label: "Endorsements (before the primary)", value: "endorsements" }
              - { label: "Election Guide (after the primary)", value: "election" }
              - { label: "Connect With Your Representatives (after results are final; menu link reads \"Find Your Reps\")", value: "representatives" }
              - { label: "Hidden (page taken down)", value: "hidden" }
            hint: "Changes the Election page's title, headings and search/social previews, the nav link on every page, and the homepage section. The page address stays nebcd.org/endorsements. Each mode has its own intro text in 🗳️ Elections → Election Page Text. Hidden removes the page from the nav and homepage and shows a short notice at its address."
          - label: "🎉 Fundraiser Callout (Homepage + Events Page)"
            name: fundraiser
            widget: object
            hint: "A highlighted card for an upcoming fundraiser, shown on the homepage and the Events page while it's switched on. Switching it off hides it but keeps everything you've typed for next time."
            fields:
              - { label: "Show Callout", name: enabled, widget: boolean, default: false, hint: "Turn on while a fundraiser is coming up, and off when it's over." }
              - { label: "Label Above Headline", name: eyebrow, widget: string, default: "Fundraiser", hint: "Small label above the headline, e.g. Fundraiser or Save the Date" }
              - { label: "Headline", name: headline, widget: string, hint: "e.g. Dining with Democrats 2026" }
              - { label: "Description", name: description, widget: text, hint: "A sentence or two about the event and what it supports." }
              - { label: "Photo", name: photo, widget: image, required: false }
              - { label: "Photo Description", name: photo_alt, widget: string, required: false, hint: "A few words describing the photo, for screen readers." }
              - { label: "Button Label", name: button_label, widget: string, hint: "e.g. Get Tickets → or Sponsor This Event →" }
              - { label: "Button Link", name: button_url, widget: string, hint: "Ticket link, ActBlue page, or sponsor.html" }
