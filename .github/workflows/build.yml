name: Build & Deploy

on:
  push:
    branches: [main]
  # Rebuild every night so past events drop off and Mobilize shifts stay current,
  # even when nobody edits the site. Runs around 1 AM Central (06:15 UTC).
  # GitHub may start scheduled runs a few minutes late; that's normal.
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Builds the finished site into _site/ and checks it before publishing.
      # If the check fails, nothing is published and the live site stays as it was.
      - name: Build site
        run: node build.js

      - uses: actions/configure-pages@v5

      # Only the finished site is published, not the data files, templates or build script.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4
